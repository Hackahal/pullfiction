[package]
name = "pullfiction-viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Browser raid planner with free-camera controls and native Blizzard raid UI"

[lib]
crate-type = ["cdylib"]

[features]
default = ["browser-static"]
browser-static = []
renderer-lab = []

[dependencies]
benilla-app = { path = "../benilla-app", default-features = false, features = ["webgpu"] }
benilla-world = { path = "../benilla-world", default-features = false, features = ["webgpu"] }
benilla-assets = { path = "../benilla-assets", default-features = false }
benilla-ui = { path = "../benilla-ui", default-features = false }
benilla-formats = { path = "../benilla-formats", default-features = false }
bevy = { workspace = true, features = ["bevy_gizmos"] }
wasm-bindgen = "=0.2.122"
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window"] }
